<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amritansh & Garvita</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Caveat&family=Outfit&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#02030a;
  color:white;
  font-family:'Outfit',sans-serif;
  overflow:hidden;
}

/* ENTRY */
#entryScreen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#02030a;z-index:9999;
}

#enterBtn{
  padding:14px 32px;
  border-radius:40px;
  border:1px solid #a78bfa;
  background:transparent;
  color:#c8a8ff;
  font-size:16px;
  cursor:pointer;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 10px #a78bfa;}
  50%{box-shadow:0 0 30px #a78bfa;}
  100%{box-shadow:0 0 10px #a78bfa;}
}

/* VIDEO */
#introVideo{
  position:fixed;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:none;
  z-index:9998;
}

/* TYPING */
#typingScreen{
  position:fixed;inset:0;
  display:none;
  align-items:center;justify-content:center;
  background:#02030a;
  z-index:9997;
  font-size:1.6rem;
  color:#ffb3d1;
  font-family:'Caveat',cursive;
}

/* MAIN SITE */
#mainContent{
  display:none;
}

/* HERO (tumhara style simplified same feel) */
.hero{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;
}

.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:60px;
  background:linear-gradient(135deg,#f5d76e,#ff7eb3,#c8a8ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  opacity:0.6;
  margin-top:10px;
}

/* TIMER */
.timer{
  text-align:center;
  margin-top:50px;
  font-size:30px;
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen">
  <button id="enterBtn">Walk with me… ✨</button>
</div>

<!-- VIDEO -->
<video id="introVideo">
  <source src="your-video.mp4" type="video/mp4">
</video>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="your-music.mp3" type="audio/mp3">
</audio>

<!-- TYPING -->
<div id="typingScreen">
  <span id="typingText"></span>
</div>

<!-- ================== ORIGINAL WEBSITE ================== -->
<div id="mainContent">

  <section class="hero">
    <h1>Amritansh <br> ❤️ <br> Garvita</h1>
    <p>Written in the stars… felt in every moment ✨</p>
  </section>

  <div class="timer">
    <div id="time"></div>
  </div>

</div>

<script>
const btn = document.getElementById("enterBtn");
const video = document.getElementById("introVideo");
const music = document.getElementById("bgMusic");
const entry = document.getElementById("entryScreen");
const typing = document.getElementById("typingScreen");
const main = document.getElementById("mainContent");

btn.onclick = () => {
  entry.style.display="none";
  video.style.display="block";
  video.play();

  music.volume=0;
  music.play();

  let v=0;
  let fade=setInterval(()=>{
    if(v<0.3){
      v+=0.02;
      music.volume=v;
    } else clearInterval(fade);
  },200);
};

video.onended = () => {
  video.style.display="none";
  typing.style.display="flex";

  let text="Garvita… ek baar bas sun lo…";
  let i=0;

  function type(){
    if(i<text.length){
      document.getElementById("typingText").innerHTML+=text[i];
      i++;
      setTimeout(type,70);
    } else {
      setTimeout(()=>{
        typing.style.display="none";
        main.style.display="block";
        document.body.style.overflow="auto";
      },1500);
    }
  }
  type();
};

// TIMER
const start = new Date("May 7, 2021").getTime();
setInterval(()=>{
  const now = new Date().getTime();
  const diff = now - start;
  const d = Math.floor(diff/(1000*60*60*24));
  document.getElementById("time").innerText = d + " days together ❤️";
},1000);
</script>

</body>
</html>
